<div class="container py-4 mx-auto w-75">
    <h3>Registrazione</h3>

    <div class="alert alert-danger" *ngIf="errorMessage">
        {{errorMessage}}
    </div>
    <div class="alert alert-success" *ngIf="successMessage">
        {{successMessage}}
    </div>

    <form (submit)="register()">
        <div class="form-group mb-3">
            <label for="username">Username:</label>
            <input type="text" class="form-control" id="username" [(ngModel)]="username" name="username">
        </div>
        <div class="form-group mb-3">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email">
        </div>
        <div class="form-group mb-3">
            <label for="password">Password (min. 8 caratteri):</label>
            <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password">
        </div>
        <div class="form-group mb-3">
            <label for="confirmPassword">Conferma Password:</label>
            <input type="password" class="form-control" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword">
        </div>
        <div class="form-group mb-3">
            <label for="comune">Comune:</label>
            <input type="text" class="form-control" id="comune" [(ngModel)]="comuneSearch" name="comuneSearch"
                   (input)="filterComuni()" autocomplete="off" placeholder="Cerca comune...">
            <div class="list-group" *ngIf="filteredComuni.length > 0" style="max-height: 200px; overflow-y: auto; position: absolute; z-index: 1000;">
                <button type="button" class="list-group-item list-group-item-action"
                        *ngFor="let comune of filteredComuni"
                        (click)="selectComune(comune)">
                    {{comune.nome}} ({{comune.provincia}})
                </button>
            </div>
        </div>
        <div class="text-end">
            <a routerLink="/login" class="btn btn-secondary me-2">Torna al Login</a>
            <button type="submit" class="btn btn-primary">Registrati</button>
        </div>
    </form>
</div>
