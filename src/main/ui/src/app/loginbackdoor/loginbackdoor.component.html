<div class="backdoor-container py-4 mx-auto w-75">
  <div class="alert alert-warning mb-4">
    <strong>⚠️ Ambiente di sviluppo</strong><br>
    Questo componente è solo per test. Rimuovere prima del deploy in produzione!
  </div>

  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Login rapido - Utenti Mock</h5>
    </div>
    <ul class="list-group list-group-flush">
      <li 
        *ngFor="let user of mockUsers" 
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
        [class.disabled]="isLoading"
        (click)="loginAs(user)"
        style="cursor: pointer;">
        <div>
          <strong>{{ user.username }}</strong>
          <small class="text-muted ms-2">{{ user.description }}</small>
        </div>
        <span *ngIf="isLoading === user.username" class="spinner-border spinner-border-sm"></span>
        <span *ngIf="isLoading !== user.username" class="text-primary">Login →</span>
      </li>
    </ul>
  </div>

  <div class="text-center mt-3">
    <a routerLink="/login" class="text-muted">Vai al login normale</a>
  </div>
</div>
