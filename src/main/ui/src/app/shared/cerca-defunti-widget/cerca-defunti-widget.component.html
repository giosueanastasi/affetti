<div *ngIf="showBanner" class="banner-header mb-4">
  <div class="banner-overlay">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h1 class="display-4 fw-semibold text-white mb-3">{{ bannerTitle }}</h1>
          <p class="fs-5 text-white-50 mb-4">{{ bannerSubtitle }}</p>
          <div class="mb-3">
            <input
              type="text"
              [formControl]="ricerca"
              class="form-control form-control-lg shadow"
              placeholder="Cerca defunto per nome o cognome..."
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!showBanner" class="mb-3">
  <input
    type="text"
    [formControl]="ricerca"
    class="form-control form-control-lg shadow-sm"
    placeholder="Cerca defunto per nome o cognome..."
  >
</div>

<!-- Slot per contenuto aggiuntivo (es. card cimiteri) tra ricerca e risultati -->
<ng-content></ng-content>

<div *ngIf="defunti.length > 0" class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="list-group shadow-sm">
        <button
          *ngFor="let defunto of defunti"
          type="button"
          (click)="dettaglio(defunto.id)"
          class="list-group-item list-group-item-action p-3"
        >
          <div class="d-flex align-items-center">
            <div class="me-3 flex-shrink-0">
              <img
                [src]="defunto.immagine_url || 'assets/default-user.webp'"
                [alt]="defunto.nome + ' ' + defunto.cognome"
                class="defunto-avatar rounded-circle"
              >
            </div>
            <div class="flex-grow-1 defunto-info">
              <h4 class="fw-semibold text-dark mb-1">{{ defunto.cognome }} {{ defunto.nome }}</h4>
              <div class="text-muted mb-1">
                <span class="text-muted">N.</span> {{ defunto.data_nascita | date:'dd/M/yyyy' }} -
                <span class="text-muted">M.</span> {{ defunto.data_decesso | date:'dd/M/yyyy' }}
              </div>
              <div class="fw-medium">
                <ng-container *ngIf="defunto.comune_decesso">
                  Cimitero {{ defunto.comune_decesso }}
                  <ng-container *ngIf="defunto.provincia_decesso"> ({{ defunto.provincia_decesso }})</ng-container>
                </ng-container>
              </div>
            </div>
            <div class="ms-3 flex-shrink-0 text-muted fs-4">
              <span class="material-icons">chevron_right</span>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="defunti.length > 0 && hasMore" class="container mt-3">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <button (click)="caricaAltri()" class="btn btn-primary">
        Carica altri
      </button>
    </div>
  </div>
</div>

<div *ngIf="defunti.length === 0 && ricercaAvviata" class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="alert alert-warning text-center">
        Nessun risultato trovato.
      </div>
    </div>
  </div>
</div>
