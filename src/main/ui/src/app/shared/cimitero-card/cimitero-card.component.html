<div class="card cimitero-card h-100"
     [class.active]="active"
     [class.inactive]="!active"
     (click)="toggle()">
  <div class="card-body d-flex align-items-center p-3">
    <div class="check-icon me-3 flex-shrink-0">
      <span class="material-icons" *ngIf="active">check_circle</span>
      <span class="material-icons" *ngIf="!active">radio_button_unchecked</span>
    </div>
    <div class="flex-grow-1">
      <h6 class="card-title fw-semibold mb-1">{{ cimitero.nome }}</h6>
      <p class="card-text text-muted small mb-0" *ngIf="cimitero.indirizzo">{{ cimitero.indirizzo }}</p>
    </div>
  </div>
</div>
