<div class="card defunto-card shadow-sm h-100" (click)="dettaglio()">
  <div class="card-body d-flex align-items-center p-3">
    <div class="me-3 flex-shrink-0">
      <img
        [src]="defunto.immagine_url || 'assets/default-user.webp'"
        [alt]="defunto.nome + ' ' + defunto.cognome"
        class="defunto-avatar rounded-circle"
      >
    </div>
    <div class="flex-grow-1 defunto-info">
      <h6 class="fw-semibold text-dark mb-1">{{ defunto.cognome }} {{ defunto.nome }}</h6>
      <div class="text-muted small">
        <span>N.</span> {{ defunto.data_nascita | date:'dd/MM/yyyy' }} -
        <span>M.</span> {{ defunto.data_decesso | date:'dd/MM/yyyy' }}
      </div>
    </div>
  </div>

  <div *ngIf="primaryColor !== null" class="card-footer bg-transparent border-top-0 pt-0 pb-2 px-3 d-flex gap-2">
    <button
      class="btn btn-sm quick-btn flex-fill"
      [class.quick-btn-inactive]="!domandaId"
      [style.background-color]="domandaId ? primaryColor : null"
      [style.border-color]="primaryColor"
      [style.color]="domandaId ? '#fff' : primaryColor"
      [disabled]="!domandaId"
      (click)="onDomandaClick($event)"
      title="Vai alla domanda"
    >
      <span class="material-icons" style="font-size:14px; vertical-align:middle;">description</span>
      Domanda
    </button>
    <button
      class="btn btn-sm quick-btn flex-fill"
      [class.quick-btn-inactive]="!contrattoId"
      [style.background-color]="contrattoId ? primaryColor : null"
      [style.border-color]="primaryColor"
      [style.color]="contrattoId ? '#fff' : primaryColor"
      [disabled]="!contrattoId"
      (click)="onContrattoClick($event)"
      title="Vai al contratto"
    >
      <span class="material-icons" style="font-size:14px; vertical-align:middle;">assignment</span>
      Contratto
    </button>
  </div>
</div>
