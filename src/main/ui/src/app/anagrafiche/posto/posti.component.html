<div class="container">
  <div class="row">
      <h2>Cerca Posto</h2>

      <form [formGroup]="postoForm">

        <div class="row">
          <h4>Dati Posto</h4>
          <label class="col-sm-1"for="loculo">Loculo</label>
              <div class="form-group col-sm-5">
              <input type="text" class="form-control" formControlName="loculo" id="loculo" aria-describedby="loculolHelp" >
            </div>

            <label class="col-sm-1 "for="fornice">Fornice</label>
            <div class="form-group col-sm-5">
             <input type="text" class="form-control" formControlName="fornice" id="fornice" aria-describedby="fornicelHelp" >
            </div>
        </div>
        <div class="row">
          <h4>Dati Assegnatario</h4>
          <label class="col-sm-1"for="nomeAss">Nome</label>
              <div class="form-group col-sm-5">
              <input type="text" class="form-control" formControlName="nomeAss" id="nomeAss" aria-describedby="nomeAsslHelp" >
            </div>

            <label class="col-sm-1 "for="cognomeAss">Cognome</label>
            <div class="form-group col-sm-5">
             <input type="text" class="form-control" formControlName="cognomeAss" id="cognomeAss" aria-describedby="cognomeAsslHelp" >
            </div>
        </div>
        <div class="row">
            <h4>Intervallo scadenza</h4>
            <label class="col-sm-1"for="data_inizio">Da</label>
            <div class="form-group col-sm-2">
            <input ng-model="answers.dob" type="date" class="form-control" formControlName="data_inizio" id="data_inizio" aria-describedby="data_iniziolHelp" >
          </div>
          <label class="col-sm-1"for="data_scadenza">a</label>
              <div class="form-group col-sm-2">
              <input ng-model="answers.dob" type="date" class="form-control" formControlName="data_scadenza" id="data_scadenza" aria-describedby="data_scadenzalHelp" >
            </div>
          
        
          <label class="col-sm-1 " for="stato">Stato</label>
          <div class="form-group col-sm-5">
            <!-- <select name="stato" id ="stato"> -->
              <select class="form-select" formControlName="stato" id="stato" name="stato" aria-label="Default select example">
              <option >-----</option>
              <option  value="LIBERO">Libero</option>
              <option  value="PRENOTATO">Prenotato</option>
              <option  value="OCCUPATO">Occupato</option>
              <option  value="DA_LIBERARE">Da Liberare</option>
            </select>
        </div>
        </div>
        <br>
        <br>
        <div class="row">
          <button class="btn btn-info col-md-2" (click)="filtraPosti(true)">Cerca</button>
          <div class="col-md-8"></div>
          <button input type="reset" value="cancella" class="btn btn-danger col-md-2">Svuota filtri</button>
        </div>
      </form>

  </div>

    <div class="mat-elevation-z8 mx-2">
      <table mat-table [dataSource]="dataSource">

        <!-- Colonna id -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> Id </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <!-- Colonna stato -->
        <ng-container matColumnDef="stato">
          <th mat-header-cell *matHeaderCellDef> Stato </th>
          <td mat-cell *matCellDef="let element"> {{element.stato}} </td>
        </ng-container>

        <!-- Colonna loculo -->
        <ng-container matColumnDef="loculo">
          <th mat-header-cell *matHeaderCellDef> Loculo </th>
          <td mat-cell *matCellDef="let element"> {{element.loculo}} </td>
        </ng-container>

        <!-- Colonna fornice -->
        <ng-container matColumnDef="fornice">
          <th mat-header-cell *matHeaderCellDef> Fornice </th>
          <td mat-cell *matCellDef="let element"> {{element.fornice}} </td>
        </ng-container>

        <!-- Colonna assegnatario -->
        <ng-container matColumnDef="assegnatario">
          <th mat-header-cell *matHeaderCellDef> Assegnatario </th>
          <td mat-cell *matCellDef="let element"> {{element.nome}} {{element.cognome}} </td>
        </ng-container>

        <!-- Colonna scadenza -->
        <ng-container matColumnDef="scadenza">
          <th mat-header-cell *matHeaderCellDef> Scadenza </th>
          <td mat-cell *matCellDef="let element"> {{element.scadenza | date: 'dd/MM/yyyy'}} </td>
        </ng-container>

        <!-- Colonna contratto -->
        <ng-container matColumnDef="contratto">
          <th mat-header-cell *matHeaderCellDef> Contratto </th>
          <td mat-cell *matCellDef="let element"> <button 
            class="btn btn-primary me-1" 
            (click)="showContrattoByProtocollo(element.protocolloContratto)" 
            [ngClass] = "{'disabled' : !element.protocolloContratto }"
             >Dettaglio</button> </td>
        </ng-container>

        <!-- Colonna modifica -->
        <ng-container matColumnDef="modifica">
          <th mat-header-cell *matHeaderCellDef> Modifica </th>
          <td mat-cell *matCellDef="let element"> <button class="btn btn-primary me-1" (click)="editPostoRequest(element)">Edit</button> </td>
        </ng-container> 

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
        [length]="totalElements"
        [pageSize]="pageSize"
        (page)="onPageChange($event)"
                    
        aria-label="Seleziona la pagina dei contraenti">
      </mat-paginator>     
    </div>
 </div>
 <app-posto-edit [posto1]="selectedPosto" (save)="onPageChange($event)"></app-posto-edit>
 <app-contratto-model [contratto]="contratto" (save)="onPageChange($event)"></app-contratto-model>
