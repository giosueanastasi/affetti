<div class="modal fade" id="cercacontraentiModal" tabIndex="-1">
    <div class="modal-dialog col-8">
        <div class="modal-content">
            <form #f="ngForm" >
                 <div class="modal-header">
                    
                    <h4 class="modal-title"> Cerca Contraenti</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                 </div>
                 <div class="modal-body d-flex flex-wrap justify-content-between">

                    <div class="alert alert-danger" *ngIf="errorMessage">
                        <strong>Error!</strong>{{errorMessage}}
                    </div>

                    <div class="form-group col-md-6 col-12  d-flex mb-3">
                        <label class="col-lg-2 col-3" for="nome">Nome</label>
                        <input 
                            type="search" 
                            id="nome" 
                            name="nome"
                            class="form-control  mx-3" 
                            [(ngModel)]="contraente1.nome"
                            #nome="ngModel"
                            required
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !nome.valid">
                        </div>
                    </div>

                    <div class="form-group col-md-6 col-12 d-flex mb-3">
                        <label class="col-lg-2 col-3"  for="cognome">Cognome</label>
                        <input 
                            type="search" 
                            id="cognome" 
                            name="cognome"
                            class="form-control  mx-3" 
                            [(ngModel)]="contraente1.cognome"
                            #cognome="ngModel"
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !cognome.valid">
                        </div>
                    </div>

                    <div class="form-group col-md-6 col-12 d-flex mb-3">
                        <label class="col-lg-2 col-3" for="codice_fiscale">Cod. Fisc.</label>
                        <input 
                            type="search" 
                            id="codice_fiscale" 
                            name="codice_fiscale"
                            class="form-control mx-3" 
                            [(ngModel)]="contraente1.codice_fiscale"
                            #codice_fiscale="ngModel"
                            
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !codice_fiscale.valid">
                        </div>
                    </div>

                    <div class="form-group col-md-6 col-12  d-flex mb-3">
                        <label class="col-lg-2 col-3" for="protocollo">N. protocollo</label>
                        <input 
                            type="search" 
                            id="protocollo" 
                            name="protocollo"
                            class="form-control mx-3" 
                            [(ngModel)]="contraente1.protocolloC"
                            #protocollo="ngModel"
                            
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !protocollo.valid">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">

                  <button input type="reset" value="cancella" class="btn btn-secondary">Svuota</button>
                  <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Chiudi</button>
                  <button type="button" class="btn btn-primary" (click)="filtraCercacontraenti(contraente1, true)">Cerca</button>
                </div>
          </form>
          
          <h2 class="ms-2">Contraenti</h2>
           <div class="mat-elevation-z8 mx-2">
            <table mat-table [dataSource]="dataSource">

                <!-- Colonna checkbox -->
                <ng-container matColumnDef="checkbox">
                    <th mat-header-cell *matHeaderCellDef>  </th>
                    <td mat-cell *matCellDef="let element">
                        <input type="checkbox"  [(ngModel)]="element.checked" [id]="'checkbox-' + element.id" (change)="setCheckboxes($event.target.checked, element.id)">
                    </td>
                </ng-container>

                <!-- Colonna nome -->
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef> Nome </th>
                    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
                </ng-container>

                <!-- Colonna cognome -->
                <ng-container matColumnDef="cognome">
                    <th mat-header-cell *matHeaderCellDef> Cognome </th>
                    <td mat-cell *matCellDef="let element"> {{element.cognome}} </td>
                </ng-container>

                <!-- Colonna codice fiscale -->
                <ng-container matColumnDef="codice fiscale">
                    <th mat-header-cell *matHeaderCellDef> Codice Fiscale </th>
                    <td mat-cell *matCellDef="let element"> {{element.codice_fiscale}} </td>
                </ng-container>

                <!-- Colonna comune residenza -->
                <ng-container matColumnDef="comune residenza">
                    <th mat-header-cell *matHeaderCellDef>Comune Residenza </th>
                    <td mat-cell *matCellDef="let element">{{element.comune_residenza}}</td>
                </ng-container>

                <!-- Colonna via residenza -->
                <ng-container matColumnDef="via residenza">
                    <th mat-header-cell *matHeaderCellDef>Via Residenza </th>
                    <td mat-cell *matCellDef="let element">{{element.via_residenza}}</td>
                </ng-container>

                <!-- Colonna provincia residenza -->
                <ng-container matColumnDef="provincia residenza">
                    <th mat-header-cell *matHeaderCellDef>Provincia Residenza </th>
                    <td mat-cell *matCellDef="let element">({{element.provincia_residenza}})</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                    showFirstLastButtons
                    [length]="totalElements"
                    [pageSize]="pageSize"
                    (page)="onPageChange($event)"
                    
                    aria-label="Seleziona la pagina dei contraenti">
            </mat-paginator>
        </div>
          <div class="d-inline-block m-3 ms-auto"><button class="btn btn-primary " (click)="assegnaContraente(contraenti)">Seleziona</button></div>
      </div>
  </div>
</div>
