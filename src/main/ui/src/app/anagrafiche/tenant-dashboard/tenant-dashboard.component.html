<div *ngIf="loading" class="container mt-5 text-center">
  <p>Caricamento...</p>
</div>

<div *ngIf="!loading && tenant">
  <!-- Header tenant -->
  <div class="tenant-header py-4" [style.background]="'linear-gradient(135deg, ' + (tenant.colorePrimario || '#667eea') + ' 0%, ' + (tenant.coloreSecondario || '#764ba2') + ' 100%)'">
    <div class="container">
      <div class="d-flex align-items-center">
        <img
          *ngIf="tenant.logoUrl"
          [src]="tenant.logoUrl"
          [alt]="tenant.descrizione"
          class="tenant-header-logo me-3"
          (error)="$any($event.target).style.display='none'"
        >
        <h2 class="text-white mb-0 fw-bold">{{ tenant.descrizione }}</h2>
      </div>
    </div>
  </div>

  <!-- Widget ricerca defunti scoped al tenant -->
  <div class="container mt-4">
    <app-cerca-defunti-widget
      [tenantId]="tenant.id"
      [cimiteroIds]="activeCimiteroIdsArray"
      [showBanner]="false"
      [bannerTitle]="'Cerca in ' + tenant.descrizione"
    >
      <!-- Card cimiteri proiettate dentro il widget, tra ricerca e risultati -->
      <div class="cimiteri-filter mt-3 mb-2" *ngIf="cimiteri.length > 0">
        <h6 class="text-muted mb-2">Cimiteri</h6>
        <div class="row g-2">
          <div class="col-lg-4 col-md-6" *ngFor="let cimitero of cimiteri">
            <app-cimitero-card
              [cimitero]="cimitero"
              [active]="isCimiteroActive(cimitero.id)"
              (toggled)="toggleCimitero(cimitero.id)"
            ></app-cimitero-card>
          </div>
        </div>
      </div>
    </app-cerca-defunti-widget>
  </div>

  <!-- Statistiche -->
  <div class="container mt-4">
    <app-tenant-statistiche
      [tenantId]="tenant.id"
      [cimiteroIds]="activeCimiteroIdsArray"
      [primaryColor]="tenant.colorePrimario || '#667eea'"
      [secondaryColor]="tenant.coloreSecondario || '#764ba2'"
    ></app-tenant-statistiche>
  </div>

  <!-- Griglia defunti con ordinamento -->
  <div class="container mt-5" *ngIf="recentDefunti.length > 0">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h4 class="mb-0">Defunti</h4>
      <div class="d-flex align-items-center gap-2">
        <label class="text-muted small mb-0 me-1">Ordina per</label>
        <select class="form-select form-select-sm" style="width: auto;" [(ngModel)]="sortBy">
          <option value="decesso_desc">Data decesso (più recente)</option>
          <option value="decesso_asc">Data decesso (meno recente)</option>
          <option value="cognome_asc">Cognome A–Z</option>
          <option value="cognome_desc">Cognome Z–A</option>
        </select>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-lg-3 col-md-4 col-sm-6" *ngFor="let defunto of sortedDefunti">
        <app-defunto-card
          [defunto]="defunto"
          [primaryColor]="tenant.colorePrimario || '#667eea'"
          [domandaId]="defunto.domandaId"
          [contrattoId]="defunto.contrattoId"
          (openDomanda)="onOpenDomanda($event)"
          (openContratto)="onOpenContratto($event)"
        ></app-defunto-card>
      </div>
    </div>
  </div>
</div>

<app-domanda-model [domanda]="selectedDomanda"></app-domanda-model>
<app-contratto-model *ngIf="selectedContratto" [contratto]="selectedContratto"></app-contratto-model>
