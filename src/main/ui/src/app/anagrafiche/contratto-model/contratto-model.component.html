<div class="modal fade" id="contrattoModal" tabIndex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form #f="ngForm">
                <div class="modal-header">
                    <h2 class="modal-title">Dettaglio Contratto </h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body container">
                    <div class="row">
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
								<h3>Protocollo</h3>
							</div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="numeroProtocolloContratto">Numero</label>
                                    <input 
                                        type="text" 
                                        id="numeroProtocolloContratto" 
                                        name="numeroProtocolloContratto"
                                        class="form-control mx-3" 
                                        [(ngModel)]="contratto.numeroProtocolloContratto"
                                        #numeroProtocolloContratto="ngModel"
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="dataProtocolloContratto">Data Inizio</label>
                                    <input 
                                        type="text" 
                                        id="dataProtocolloContratto" 
                                        name="dataProtocolloContratto"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.dataProtocolloContratto"
                                        #dataProtocolloContratto="ngModel"
                                        readonly
                                        >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="dataScadenzaContratto">Data Fine</label>
                                    <input 
                                    type="text" 
                                    id="dataScadenzaContratto" 
                                    name="dataScadenzaContratto"
                                    class="form-control mx-3 notEdit" 
                                    [(ngModel)]="contratto.dataScadenzaContratto"
                                    #dataScadenzaContratto="ngModel"
                                    readonly
                                    >
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
						        <h3>Dati Contraente</h3>
						    </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="nomeC">Nome</label>
                                    <input 
                                        type="text" 
                                        id="nomeC" 
                                        name="nomeC"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.nomeC"
                                        #nomeC="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="cognomeC">Cognome</label>
                                    <input 
                                        type="text" 
                                            id="cognomeC" 
                                            name="cognomeC"
                                            class="form-control mx-3 notEdit" 
                                            [(ngModel)]="contratto.cognomeC"
                                            #cognomeC="ngModel"
                                            readonly
                                    >
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
								<h3>Dati Nascita</h3>
							</div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="comune_nascita">Comune</label>
                                    <input 
                                        type="text" 
                                        id="comune_nascita" 
                                        name="comune_nascita"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.comune_nascita"
                                        #comune_nascita="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                <label class="col-lg-2 col-3" for="provincia_nascita">Provincia</label>
                                    <input 
                                        type="text" 
                                        id="provincia_nascita" 
                                        name="provincia_nascita"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.provincia_nascita"
                                        #provincia_nascita="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="stato_nascita">Stato</label>
                                    <input 
                                        type="text" 
                                        id="stato_nascita" 
                                        name="stato_nascita"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.stato_nascita"
                                        #stato_nascita="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="data_nascita">Data di Nascita</label>
                                    <input 
                                        type="text" 
                                        id="data_nascita" 
                                        name="data_nascita"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.data_nascita"
                                        #data_nascita="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
                                <h3>Dati Residenza</h3>
                            </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="comune_residenza">Comune</label>
                                <input 
                                    type="text" 
                                    id="comune_residenza" 
                                    name="comune_residenza"
                                    class="form-control mx-3 notEdit" 
                                    [(ngModel)]="contratto.comune_residenza"
                                    #comune_residenza="ngModel"
                                    readonly
                                >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="provincia_residenza">Provincia</label>
                                    <input 
                                        type="text" 
                                        id="provincia_residenza" 
                                        name="provincia_residenza"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.provincia_residenza"
                                        #provincia_residenza="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="via_residenza">Indirizzo</label>
                                    <input 
                                        type="text" 
                                        id="via_residenza" 
                                        name="via_residenza"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.via_residenza"
                                        #via_residenza="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="cap_residenza">Cap</label>
                                    <input 
                                        type="text" 
                                        id="cap_residenza" 
                                        name="cap_residenza"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.cap_residenza"
                                        #cap_residenza="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
                                <h3>Altri Dati</h3>
                            </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="codice_fiscale">Codice Fiscale</label>
                                    <input 
                                        type="text" 
                                        id="codice_fiscale" 
                                        name="codice_fiscale"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.codice_fiscale"
                                        #codice_fiscale="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="email">Email</label>
                                    <input 
                                        type="text" 
                                        id="email" 
                                        name="email"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.email"
                                        #email="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="telefono">Telefono</label>
                                    <input 
                                        type="text" 
                                        id="telefono" 
                                        name="telefono"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.telefono"
                                        #telefono="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="note">Note</label>
                                    <input 
                                        type="text" 
                                        id="note" 
                                        name="note"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.note"
                                        #note="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
                                <h3>Dati Posto</h3>
                            </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="loculo">Loculo</label>
                                    <input 
                                        type="text" 
                                        id="loculo" 
                                        name="loculo"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.loculo"
                                        #loculo="ngModel"
                                        readonly
                                    >
                                </div>    

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="fornice">Fornice</label>
                                    <input 
                                        type="text" 
                                        id="fornice" 
                                        name="fornice"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.fornice"
                                        #fornice="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
                                <h3>Dati Assegnatario</h3>
                            </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="nomeA">Nome</label>
                                    <input 
                                        type="text" 
                                        id="nomeA" 
                                        name="nomeA"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.nomeA"
                                        #nomeA="ngModel"
                                        readonly
                                    >
                                </div>
                                

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="cognomeA">Cognome</label>
                                    <input 
                                        type="text" 
                                        id="cognomeA" 
                                        name="cognomeA"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.cognomeA"
                                        #cognomeA="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
                                <h3>Dati Decesso</h3>
                            </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="comune_decesso">Comune</label>
                                    <input 
                                        type="text" 
                                        id="comune_decesso" 
                                        name="comune_decesso"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.comune_decesso"
                                        #comune_decesso="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="data_decesso">Data</label>
                                    <input 
                                        type="text" 
                                        id="data_decesso" 
                                        name="data_decesso"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.data_decesso"
                                        #data_decesso="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                                
                    <div class="row">
                        <div class="col-md-6 col-sm-12 p-3">
                            <div class="col-12">
                                <h3>Dati Domanda</h3>
                            </div>
                            <div class="col-12">
                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="protocolloDomanda">Protocollo</label>
                                    <input 
                                        type="text" 
                                        id="protocolloDomanda" 
                                        name="protocolloDomanda"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.protocolloDomanda"
                                        #protocolloDomanda="ngModel"
                                        readonly
                                    >
                                </div>

                                <div class="form-group col-12 d-flex mb-3">
                                    <label class="col-lg-2 col-3" for="dataProtocolloDomanda">Data</label>
                                    <input 
                                        type="text" 
                                        id="dataProtocolloDomanda" 
                                        name="dataProtocolloDomanda"
                                        class="form-control mx-3 notEdit" 
                                        [(ngModel)]="contratto.dataProtocolloDomanda"
                                        #dataProtocolloDomanda="ngModel"
                                        readonly
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-danger" data-bs-dismiss="modal" >Chiudi</button>
                    <button class="btn btn-primary" (click)="saveContratto()">Salva modifiche</button>
                </div>  
            </form>
        </div>
    </div>
</div>
