<div class="modal fade" id="postiModal" tabIndex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form #f="ngForm" >
                 <div class="modal-header">
                    <h2 class="modal-title"> Cerca Posto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                 </div>
                 <div class="modal-body">

                    <div class="alert alert-danger" *ngIf="errorMessage">
                        <strong>Error!</strong>{{errorMessage}}
                    </div>

                    <h3>Dati posto </h3>
                    <div class="form-group">
                        <label for="loculo">loculo</label>
                        <input 
                            type="search" 
                            id="loculo" 
                            name="loculo"
                            class="form-control" 
                            [(ngModel)]="posto1.loculo"
                            #loculo="ngModel"
                            required
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !loculo.valid">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fornice">fornice</label>
                        <input 
                            type="search" 
                            id="fornice" 
                            name="fornice"
                            class="form-control" 
                            [(ngModel)]="posto1.fornice"
                            #fornice="ngModel"
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !fornice.valid">
                        </div>
                    </div>


                    <div class="form-group">
                        <label for="stato">stato</label>
                        <!-- <select name="stato" id ="stato"> -->
                        <select class="form-select" 
                                aria-label="Default select example"
                                type="search" 
                                id="stato" 
                                name="stato"
                                class="form-control" 
                                [(ngModel)]="posto1.stato"
                                #stato="ngModel"
                                
                                >
                        <option >-----</option>
                        <option  value="LIBERO">Libero</option>
                        <option  value="PRENOTATO">Prenotato</option>
                        <option  value="OCCUPATO">Occupato</option>
                        <option  value="DA_LIBERARE">Da Liberare</option>
                        </select>
                    </div>


                    <h3>Assegnatario </h3>
                    <div class="form-group ">
                        <label for="nome">Nome</label>
                        <input 
                            type="search" 
                            id="nome" 
                            name="nome"
                            class="form-control" 
                            [(ngModel)]="posto1.nome"
                            #nome="ngModel"
                            
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !nome.valid">
                        </div>
                    </div>

                    <div class="form-group ">
                        <label for="cognome">Cognome</label>
                        <input 
                            type="search" 
                            id="cognome" 
                            name="cognome"
                            class="form-control" 
                            [(ngModel)]="posto1.cognome"
                            #cognome="ngModel"
                            
                            >
                        <div class="alert-danger" *ngIf="f.submitted && !cognome.valid">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">

                    <button input type="reset" value="cancella" class="btn btn-secondary" data-bs-dismiss="modal">svuota</button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Chiudi</button>
                  <button type="button" class="btn btn-primary"(click)="filtraPosti(posto1)">Cerca</button>
                </div>
          </form>
          <h2 class="ms-2">Posti Liberi</h2>

          <div class="mat-elevation-z8 mx-2">
            <table mat-table [dataSource]="dataSource">

                <!-- Colonna checkbox -->
                <ng-container matColumnDef="checkbox">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let element">
                        <input type="checkbox" [(ngModel)]="element.checked" [id]="'checkbox-' + element.id" (change)="setCheckboxes($event.target.checked, element.id)">
                    </td>
                </ng-container>

                <!-- Colonna stato -->
                <ng-container matColumnDef="stato">
                    <th mat-header-cell *matHeaderCellDef> Stato </th>
                    <td mat-cell *matCellDef="let element"> {{element.stato}} </td>
                </ng-container>

                <!-- Colonna loculo -->
                <ng-container matColumnDef="loculo">
                    <th mat-header-cell *matHeaderCellDef> Loculo </th>
                    <td mat-cell *matCellDef="let element"> {{element.loculo}} </td>
                </ng-container>

                <!-- Colonna fornice -->
                <ng-container matColumnDef="fornice">
                    <th mat-header-cell *matHeaderCellDef> Fornice </th>
                    <td mat-cell *matCellDef="let element"> {{element.fornice}} </td>
                </ng-container>

                <!-- Colonna nome -->
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef> Nome </th>
                    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
                </ng-container>

                <!-- Colonna cognome -->
                <ng-container matColumnDef="cognome">
                    <th mat-header-cell *matHeaderCellDef> Cognome </th>
                    <td mat-cell *matCellDef="let element"> {{element.cognome}} </td>
                </ng-container>

                <!-- Colonna scadenza -->
                <ng-container matColumnDef="scadenza">
                    <th mat-header-cell *matHeaderCellDef> Scadenza </th>
                    <td mat-cell *matCellDef="let element"> {{element.scadenza | date: 'dd/MM/yyyy'}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            
            </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                    showFirstLastButtons
                    [length]="totalElements"
                    [pageSize]="pageSize"
                    (page)="onPageChange($event)"
                    
                    aria-label="Seleziona la pagina dei contraenti">
            </mat-paginator>            
          </div>
          <button type="button" class="btn btn-primary" (click)="assegnaPosto(posti)">Seleziona</button>
      </div>
  </div>
</div>
